services:
  website:
    image: nginx:alpine
    profiles: [prod]
    volumes: ["./www/website:/usr/share/nginx/html:ro"]
    networks: [rootstock-proxy]
    labels:
      rootstock.acceptance: "${ROOTSTOCK_ACCEPTANCE_RUN}"
      traefik.enable: "true"
      traefik.http.routers.acceptance-website.rule: "Host(`demo.test`) || Host(`www.demo.test`)"
      traefik.http.routers.acceptance-website.entrypoints: "web"
      traefik.http.routers.acceptance-website.service: "acceptance-website"
      traefik.http.services.acceptance-website.loadbalancer.server.port: "80"

  api:
    image: nginx:alpine
    profiles: [prod]
    volumes: ["./www/api:/usr/share/nginx/html:ro"]
    networks: [rootstock-proxy]
    labels:
      rootstock.acceptance: "${ROOTSTOCK_ACCEPTANCE_RUN}"
      traefik.enable: "true"
      traefik.http.routers.acceptance-api.rule: "Host(`api.demo.test`) || Host(`admin.demo.test`)"
      traefik.http.routers.acceptance-api.entrypoints: "web"
      traefik.http.routers.acceptance-api.service: "acceptance-api"
      traefik.http.services.acceptance-api.loadbalancer.server.port: "80"

networks:
  rootstock-proxy:
    external: true
    name: ${ROOTSTOCK_PROXY_NETWORK}
