name: Infrastructure

on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']

jobs:
  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Exclude optional examples
        run: rm -rf "${GITHUB_WORKSPACE:?}/examples"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm test
