name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.3
      - run: ./tools/styles.sh --check
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Proves routing against a real Traefik, including that an unknown hostname
  # reaches no application.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: ./tests/acceptance/run.sh
      - run: ./tests/sqlite/run.sh

  # The droplet runs x86-64 Linux; a statically linked binary needs nothing
  # installed there to run.
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2.9.3
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p rootstock -p rootstock-mcp --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: rootstock-x86_64-unknown-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/rootstock
            target/x86_64-unknown-linux-musl/release/rootstock-mcp
          if-no-files-found: error

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
