[package]
name = "leptos-placeholder"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
leptos = { version = "0.8.23", default-features = false, features = ["ssr"] }
tokio = { version = "1", features = ["macros", "rt", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
