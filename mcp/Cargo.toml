[package]
name = "rootstock-mcp"
version = "0.1.0"
edition = "2024"
description = "Read-only local MCP tools for Rootstock deployments"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
rootstock = { path = "..", features = ["api-schema"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3.27.0"
