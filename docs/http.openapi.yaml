openapi: 3.1.0
info:
  title: Rootstock local console
  version: 0.1.0
  description: Read-only loopback HTML interface. MCP uses a separate stdio process.
servers:
  - url: http://127.0.0.1:8787
    description: Default local port; select another with observe --port.
paths:
  /:
    get:
      operationId: getConsoleOverview
      summary: View live deployments and optional container details
      description: >-
        Host must be 127.0.0.1:<port> or localhost:<port>. Only the inspect query parameter
        is supported, once, as an unsigned decimal index. Other query syntax returns 404.
        An out-of-range numeric index renders the overview with all details closed.
        Other HTTP methods return 405; unknown paths return 404.
        Shows host memory, available RAM, cache, and swap where supported, separately
        from container totals. A failed host memory read leaves the overview available
        with an unavailable indicator; it does not produce 503 on its own.
      parameters:
        - name: inspect
          in: query
          required: false
          description: Zero-based deployment index in the current project-sorted snapshot.
          schema:
            type: integer
            minimum: 0
          example: 0
      responses:
        '200':
          description: Fresh HTML overview, including an empty host or inventory.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/UnexpectedHost'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          description: HTML error view with expandable Docker/SSH or inventory diagnostics.
          content:
            text/html:
              schema:
                type: string
  /favicon.svg:
    get:
      operationId: getConsoleFavicon
      summary: Read the shared console logo as an SVG favicon
      description: >-
        Returns the same embedded artwork used by the header. Host must be
        127.0.0.1:<port> or localhost:<port>. No query parameters are accepted.
        This route does not query Docker or read inventory.
      responses:
        '200':
          description: Shared SVG logo, available independently of Docker connectivity.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            image/svg+xml:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/UnexpectedHost'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
components:
  responses:
    UnexpectedHost:
      description: Unexpected Host header; checked before the method or path.
      content:
        text/html:
          schema:
            type: string
          example: Unexpected Host header
    NotFound:
      description: Unsupported path or query syntax.
      content:
        text/html:
          schema:
            type: string
          example: Not found
    MethodNotAllowed:
      description: Only GET is supported, including rejection of HEAD.
      content:
        text/html:
          schema:
            type: string
          example: Only GET is supported
  headers:
    NoStore:
      description: Responses are not cached; applies to error responses as well.
      schema:
        type: string
        const: no-store
